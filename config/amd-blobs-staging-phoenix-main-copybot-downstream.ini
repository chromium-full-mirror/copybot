[copybot]
topic = "amd-blobs-downstream"
label = ["Verified+1", "Bot-Commit+1", "Commit-Queue+2"]
re = ["cros-amd-review@google.com"]
push-option = ["uploadvalidator~skip", "nokeycheck"]
prepend-subject = "UPSTREAM: "
keep-pseudoheader = ["Cq-Depend"]
upstream-history-limit = 5
downstream-history-limit = 1000
upstream-url = "https://chrome-internal.googlesource.com/chromeos/third_party/amd-blobs-staging:upstream/main:phoenix"
downstream-url = "https://chrome-internal.googlesource.com/chromeos/overlays/chipset-phoenix-private:main:sys-boot/coreboot-private-files-chipset/files/3rdparty/amd_blobs/phoenix"
