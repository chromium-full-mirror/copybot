[copybot]
topic = "amd-fsp-downstream"
label = [Verified+1, Bot-Commit+1, Commit-Queue+2]
re = [cros-amd-review@google.com]
push-option = [uploadvalidator~skip, nokeycheck]
prepend-subject = "UPSTREAM: "
keep-pseudoheader = [Cq-Depend]
downstream-history-limit = 1000
upstream-url = "https://chrome-internal.googlesource.com/chromeos/third_party/amd-fsp-staging:upstream/mdn_fsp:"
downstream-url = "https://chrome-internal.googlesource.com/chromeos/third_party/amd-fsp-staging:mdn_fsp:"
