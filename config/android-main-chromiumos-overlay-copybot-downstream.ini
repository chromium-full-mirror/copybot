[copybot]
topic = "android-downstream"
label = [Verified+1, Bot-Commit+1, Commit-Queue+2]
push-option = [uploadvalidator~skip, nokeycheck]
ht = [main-fw-android]
insert-into-msg = [1:Android Bringup: See http://go/android-fw-sync]
exclude-file-pattern = [eclass/libchrome-version.eclass]
exclude-method = "FILTER"
merge-conflict-behavior = "ALLOW_CONFLICT"
keep-pseudoheader = [Cq-Depend, Change-Id]
upstream-history-limit = 5
downstream-history-limit = 1000
upstream-history-starts-with = "a5b981b76168b099f318a667407c845a1c48c942"
downstream-history-starts-with = "3ed6d871ce82008016decc39876e3d50af39d430"
upstream-url = "https://chromium.googlesource.com/chromiumos/overlays/chromiumos-overlay:main:"
downstream-url = "https://chromium.googlesource.com/chromiumos/overlays/chromiumos-overlay:firmware-android-15949.B:"
