[copybot]
topic = "android-downstream"
label = [Verified+1, Bot-Commit+1, Commit-Queue+2]
push-option = [uploadvalidator~skip, nokeycheck]
ht = [main-fw-android]
insert-into-msg = [1:Android Bringup: See http://go/android-fw-sync]
merge-conflict-behavior = "ALLOW_CONFLICT"
keep-pseudoheader = [Cq-Depend, Change-Id]
upstream-history-limit = 5
downstream-history-limit = 1000
upstream-history-starts-with = "4ab8d0085e8dbcc88d24af6ed37e118905a5ac08"
downstream-history-starts-with = "100e864672bdd5fc2c5b121c223300c921cba0f1"
upstream-url = "https://chromium.googlesource.com/chromiumos/platform/vboot_reference:main:"
downstream-url = "https://chromium.googlesource.com/chromiumos/platform/vboot_reference:firmware-android-15949.B:"
