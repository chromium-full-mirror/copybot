downstream-history-limit = 1000
upstream-history-starts-with = "2996e2b4cdb81f746208a84ddf9a7e228a83fa58"
downstream-history-starts-with = "cb2be2ff68169275379579a3af013dc59186f278"
upstream-url = "https://review.coreboot.org/blobs:main:"
