[copybot]
topic = "coreboot-downstream"
label = [Verified+1, Bot-Commit+1, Commit-Queue+2]
re = [coreboot-downstreamer@google.com]
push-option = [uploadvalidator~skip, nokeycheck]
prepend-subject = "UPSTREAM: "
exclude-file-pattern = [3rdparty, OWNERS, PRESUBMIT.cfg, .checkpatch.conf, .gitignore, .gitmodules, unblocked_terms.txt, util/crossgcc, util/nvidia/cbootimage]
merge-conflict-behavior = "FAIL"
keep-pseudoheader = [Cq-Depend]
upstream-history-starts-with = "2e92833172a94684217ea30c78d21ac32ae74a03"
downstream-history-starts-with = "641d7ecb3e2cdef724de4ef54cacb8a74c6152d2"
upstream-url = "https://review.coreboot.org/coreboot:main:"
downstream-url = "https://chromium.googlesource.com/chromiumos/third_party/coreboot:main:"
