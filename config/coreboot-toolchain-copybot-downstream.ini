[copybot]
topic = "coreboot-toolchain-downstream"
label = [Verified+1, Bot-Commit+1, Commit-Queue+2]
re = [firmware-toolchain@google.com]
push-option = [uploadvalidator~skip, nokeycheck]
prepend-subject = "UPSTREAM: "
merge-conflict-behavior = "FAIL"
keep-pseudoheader = [Cq-Depend]
downstream-history-limit = 1000
upstream-history-starts-with = "89e4fff2d35dd8a2f9b6c021f309b49d883fb3b6"
downstream-history-starts-with = "0838b638f07e9a2c2c59fe1bc567aaed181905e8"
upstream-url = "https://review.coreboot.org/coreboot:main:util/crossgcc"
downstream-url = "https://chromium.googlesource.com/chromiumos/third_party/coreboot:main:util/crossgcc"
