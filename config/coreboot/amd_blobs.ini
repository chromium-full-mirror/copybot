[copybot]
topic = "coreboot-downstream"
label = ["Verified+1", "Bot-Commit+1", "Commit-Queue+2"]
re = ["cros-amd-review@google.com", "coreboot-downstreamer@google.com"]
push-option = ["uploadvalidator~skip", "nokeycheck"]
prepend-subject = "UPSTREAM: 3rdparty/amd_blobs/"
merge-conflict-behavior = STOP
keep-pseudoheader = ["Cq-Depend", "BUG", "TEST"]
downstream-history-limit = 1000
upstream-history-starts-with = "c4e26ba9bad1c74bfaaba06a302c6f768c6747b5"
downstream-history-starts-with = "37ab653c4b9974db802cb3a072a79c7daecbbbb0"
upstream-url = "https://review.coreboot.org/amd_blobs:main:"
downstream-url = "https://chromium.googlesource.com/chromiumos/third_party/coreboot:main:3rdparty/amd_blobs"
