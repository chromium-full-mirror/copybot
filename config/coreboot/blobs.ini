[copybot]
topic = "coreboot-downstream"
label = ["Verified+1", "Bot-Commit+1", "Commit-Queue+2"]
re = ["coreboot-downstreamer@google.com", "coreboot-downstreamer@google.com"]
push-option = ["uploadvalidator~skip", "nokeycheck"]
prepend-subject = "UPSTREAM: 3rdparty/blobs/"
merge-conflict-behavior = STOP
keep-pseudoheader = ["Cq-Depend", "BUG", "TEST"]
downstream-history-limit = 1000
upstream-history-starts-with = "c236894e3c1de8501f007a9bf61255684c89cd30"
downstream-history-starts-with = "e0babca709c8612a846b41f138d2af4e16053e09"
upstream-url = "https://review.coreboot.org/blobs:main:"
downstream-url = "https://chromium.googlesource.com/chromiumos/third_party/coreboot:main:3rdparty/blobs"
