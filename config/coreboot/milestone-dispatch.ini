[copybot]
topic = "coreboot-milestone-dispatch"
label = ["Verified+1", "Bot-Commit+1", "Commit-Queue+2"]
re = ["coreboot-downstreamer@google.com"]
push-option = ["uploadvalidator~skip", "nokeycheck"]
merge-conflict-behavior = ALLOW_CONFLICT
keep-pseudoheader = ["Cq-Depend", "BUG", "TEST", "BRANCH", "Original-BRANCH", "Change-Id"]
dynamic-downstream-pattern = "^firmware-R(\\d+)-[\\d.]+\\.B$"
min-milestone = 150
include-main-branch = True
upstream-url = "https://chromium.googlesource.com/chromiumos/third_party/coreboot:main:"
downstream-url = "https://chromium.googlesource.com/chromiumos/third_party/coreboot:main:"
