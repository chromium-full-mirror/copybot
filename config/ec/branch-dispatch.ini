[copybot]
topic = "ec-branch-dispatch"
label = ["Verified+1", "Bot-Commit+1", "Commit-Queue+2"]
push-option = ["uploadvalidator~skip", "nokeycheck"]
merge-conflict-behavior = ALLOW_CONFLICT
keep-pseudoheader = ["Cq-Depend", "BUG", "TEST", "BRANCH", "Original-BRANCH", "Change-Id"]
upstream-history-limit = 200
dispatch-branch-tags = True
upstream-url = "https://chromium.googlesource.com/chromiumos/platform/ec:main:"
downstream-url = "https://chromium.googlesource.com/chromiumos/platform/ec:main:"
