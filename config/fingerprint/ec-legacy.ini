[copybot]
topic = "ec-legacy-sync"
label = ["Verified+1", "Bot-Commit+1", "Commit-Queue+2"]
push-option = ["uploadvalidator~skip", "nokeycheck"]
prepend-subject = "UPSTREAM: "
merge-conflict-behavior = STOP
keep-pseudoheader = ["Cq-Depend"]
upstream-history-limit = 0
# Forked at b39029de9564d0b5b0f1752049bb5f995ba3fa58
upstream-history-starts-with = "b39029de9564d0b5b0f1752049bb5f995ba3fa58"
downstream-history-starts-with = "b39029de9564d0b5b0f1752049bb5f995ba3fa58"
upstream-url = "https://chromium.googlesource.com/chromiumos/platform/ec:main:"
downstream-url = "https://chromium.googlesource.com/chromiumos/platform/ec:ec-legacy:"
include-downstream = "common/fpsensor"
include-downstream = "include/ec_commands.h"
include-downstream = "test/run_device_tests.py"
include-downstream = "util/flash_fp_mcu"
include-downstream = "util/renode"
include-downstream = "util/renode_ec_launch.py"
