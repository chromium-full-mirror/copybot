[copybot]
topic = "ec-legacy-sync"
label = ["Verified+1", "Bot-Commit+1", "Commit-Queue+2"]
push-option = ["uploadvalidator~skip", "nokeycheck"]
prepend-subject = "UPSTREAM: "
merge-conflict-behavior = STOP
keep-pseudoheader = ["Cq-Depend"]
upstream-history-limit = 0
include-downstream = ["common/fpsensor/*", "common/mock/fpsensor*", "common/mock/rollback*", "common/rollback*", "driver/fingerprint/*", "include/ec_commands.h", "include/fpsensor/*", "test/fpsensor*", "test/run_device_tests.py", "util/renode/*", "util/renode_ec_launch.py"]
upstream-history-starts-with = "13345bcf334ec7f9fe3874d121777e59617098a3"
downstream-history-starts-with = "0e5eae2cb4a84e56f606718a12d4e12ff0337107"
upstream-url = "https://chromium.googlesource.com/chromiumos/platform/ec:main:"
downstream-url = "https://chromium.googlesource.com/chromiumos/platform/ec:ec-legacy:"
