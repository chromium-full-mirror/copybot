[copybot]
topic = "ec-legacy-sync"
label = ["Verified+1", "Bot-Commit+1", "Commit-Queue+2"]
push-option = ["uploadvalidator~skip", "nokeycheck"]
prepend-subject = "UPSTREAM: "
merge-conflict-behavior = STOP
keep-pseudoheader = ["Cq-Depend"]
upstream-history-limit = 0
include-downstream = ["common/fpsensor/*", "common/mock/fpsensor*", "common/mock/rollback*", "common/rollback*", "driver/fingerprint/*", "include/ec_commands.h", "include/ec_cmd_api.h", "include/fpsensor/*", "test/run_device_tests.py", "util/flash_ec", "util/flash_jlink.py", "util/renode/*", "util/renode_ec_launch.py"]
upstream-history-starts-with = "a9c945416254e16106093c4bead4672aa18bb142"
downstream-history-starts-with = "0b1f15d62a206d3080c89872bf0d2e84ad683a01"
upstream-url = "https://chromium.googlesource.com/chromiumos/platform/ec:main:"
downstream-url = "https://chromium.googlesource.com/chromiumos/platform/ec:ec-legacy:"
