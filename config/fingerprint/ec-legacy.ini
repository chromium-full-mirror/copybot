include-downstream = ["common/fpsensor", "include/ec_commands.h", "test/run_device_tests.py", "util/renode", "util/renode_ec_launch.py"]
upstream-history-starts-with = "7e6cf88a59a3d3869fe46c3bc14b98f40352c27b"
downstream-history-starts-with = "d60bd2de8b2dd46d3eca41125d811f38cb2dcb8f"
upstream-url = "https://chromium.googlesource.com/chromiumos/platform/ec:main:"
downstream-url = "https://chromium.googlesource.com/chromiumos/platform/ec:ec-legacy:"
