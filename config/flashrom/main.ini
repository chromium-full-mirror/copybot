[copybot]
topic = "flashrom-downstream"
label = ["Verified+1", "Bot-Commit+1", "Commit-Queue+2"]
re = ["cros-flashrom-reviews@google.com"]
push-option = ["uploadvalidator~skip", "nokeycheck"]
prepend-subject = "UPSTREAM: "
merge-conflict-behavior = ALLOW_CONFLICT
add-signed-off-by = True
keep-pseudoheader = ["Cq-Depend"]
downstream-history-limit = 1000
upstream-url = "https://review.coreboot.org/flashrom:main:"
downstream-url = "https://chromium.googlesource.com/chromiumos/third_party/flashrom:master:"
