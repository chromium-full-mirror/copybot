[copybot]
topic = "amdgpu-grunt-firmware-uprev"
label = ["Verified+1", "Commit-Queue+1"]
re = ["cros-amd-review@google.com"]
push-option = ["uploadvalidator~skip", "nokeycheck"]
prepend-subject = "UPSTREAM: amdgpu: "
keep-pseudoheader = ["Cq-Depend", "Signed-off-by", "Tested-by"]

upstream-history-limit = 10
downstream-history-limit = 1000
upstream-history-start = "6bc2c609988823744d1a45d33ee370c8310ec305"
downstream-history-start = "c626a39683577d582c489d785521b5d8f06941ba"

upstream-url = "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git:main:"
downstream-url = "https://chromium.googlesource.com/chromiumos/third_party/linux-firmware:master:"

include = ["amdgpu/stoney*.bin"]
