[copybot]
topic = "multiple-downstreams"
label = ["Verified+1", "Bot-Commit+1", "Commit-Queue+2"]
re = ["example@gmail.com"]
push-option = ["uploadvalidator~skip", "nokeycheck"]
merge-conflict-behavior = STOP
keep-pseudoheader = ["Cq-Depend"]
downstream-history-limit = 1000
upstream-history-starts-with = "deadbeef"
downstream-history-starts-with = "ebebebeb"
enable-kernel-cl-dispatcher = True
upstream-url = "https://chromium.googlesource.com/chromiumos/upstream:main:"
downstreams = {'first': {'url': 'https://chromium.googlesource.com/chromiumos/downstream1:main1:subtree1'}, 'second': {'url': 'https://android.googlesource.com/chromiumos/downstream2:main2:subtree2', 'history-starts-with': 'customhash123', 'cl-dispatcher-history-starts-with': 'dispatcherhash123', 'history-limit': 500}}
